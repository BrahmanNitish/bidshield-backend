version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bidshield_pg
    restart: always
    environment:
      POSTGRES_USER: bidshield
      POSTGRES_PASSWORD: bidshield_password
      POSTGRES_DB: bidshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bidshield_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: